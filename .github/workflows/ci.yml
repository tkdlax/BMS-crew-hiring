name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build -w @bms/shared
      - run: npm run build -w @bms/api
      - run: npm run test -w @bms/api
      - run: npm run build -w @bms/web
